<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        document.body.innerHTML = '<div style="color:red; font-size:16px; font-weight:bold; padding:20px; z-index:9999; position:absolute; top:0; left:0; width:100%; height:100%; background:black;">' + 
          'RUNTIME ERROR:<br/><br/>' + message + '<br/><br/>' + (error ? error.stack : '') + '</div>';
      };
      window.addEventListener("unhandledrejection", function(promiseRejectionEvent) { 
        document.body.innerHTML = '<div style="color:red; font-size:16px; font-weight:bold; padding:20px; z-index:9999; position:absolute; top:0; left:0; width:100%; height:100%; background:black;">' + 
          'UNHANDLED PROMISE:<br/><br/>' + promiseRejectionEvent.reason + '</div>';
      });
    </script>
    <meta
      name="description"
      content="API Collection Manager - Postman ve Bruno collection'larınızı yönetin ve çalıştırın"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>API Collection Manager</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
